name: Greating Stock Monitor

on:

  workflow_dispatch:

concurrency:
  group: greating-stock-monitor
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-monitor.txt

      - name: Restore Google OAuth files
        env:
          GOOGLE_CREDENTIALS_B64: ${{ secrets.GOOGLE_CREDENTIALS_B64 }}
          GOOGLE_TOKEN_B64: ${{ secrets.GOOGLE_TOKEN_B64 }}
        run: |
          echo "$GOOGLE_CREDENTIALS_B64" | base64 --decode > credentials.json
          echo "$GOOGLE_TOKEN_B64" | base64 --decode > token.json

      - name: Run Greating stock monitor
        run: |
          python stock_monitor_v0.2.2.py